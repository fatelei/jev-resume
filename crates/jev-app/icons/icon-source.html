<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  /* macOS 图标网格: 1024 画布, 内容 824, 四周留 100 透明边距, 圆角 185 */
  .canvas {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px;
    background: linear-gradient(160deg, #3b82f6 0%, #2563eb 45%, #1e3a8a 100%);
    border-radius: 185px;
  }
  .glow {
    position: absolute; width: 640px; height: 640px; left: -160px; top: -160px;
    background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 65%);
  }
  .sheet {
    position: absolute; left: 212px; top: 137px; width: 400px; height: 550px;
    background: #ffffff;
    border-radius: 30px;
    box-shadow: 0 22px 48px rgba(15, 23, 42, 0.38);
    padding: 52px 46px;
    box-sizing: border-box;
  }
  .fold {
    position: absolute; right: 0; top: 0; width: 90px; height: 90px;
    background: linear-gradient(225deg, #dbeafe 50%, #eff6ff 50%);
    border-radius: 0 30px 0 24px;
  }
  .name {
    width: 190px; height: 36px; border-radius: 10px;
    background: #1e293b; margin-bottom: 30px;
  }
  .line {
    height: 17px; border-radius: 9px; background: #cbd5e1; margin-bottom: 22px;
  }
  .line.w80 { width: 80%; }
  .line.w90 { width: 90%; }
  .line.w70 { width: 70%; }
  .gap { height: 22px; }
  .dims { position: absolute; left: 46px; bottom: 46px; width: 308px; }
  .dim { display: flex; align-items: center; margin-bottom: 18px; }
  .dot { width: 25px; height: 25px; border-radius: 7px; margin-right: 16px; }
  .bar { height: 18px; border-radius: 9px; }
  .d1 .dot { background: #2563eb; } .d1 .bar { width: 200px; background: #93c5fd; }
  .d2 .dot { background: #0d9488; } .d2 .bar { width: 160px; background: #5eead4; }
  .d3 .dot { background: #d97706; } .d3 .bar { width: 120px; background: #fcd34d; }
  .d4 .dot { background: #dc2626; } .d4 .bar { width: 70px;  background: #fca5a5; }
  .dim:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="sheet">
      <div class="fold"></div>
      <div class="name"></div>
      <div class="line w80"></div>
      <div class="line w90"></div>
      <div class="line w70"></div>
      <div class="gap"></div>
      <div class="line w90"></div>
      <div class="line w80"></div>
      <div class="dims">
        <div class="dim d1"><div class="dot"></div><div class="bar"></div></div>
        <div class="dim d2"><div class="dot"></div><div class="bar"></div></div>
        <div class="dim d3"><div class="dot"></div><div class="bar"></div></div>
        <div class="dim d4"><div class="dot"></div><div class="bar"></div></div>
      </div>
    </div>
  </div>
</body>
</html>
