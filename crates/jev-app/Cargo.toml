[package]
name = "jev-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "阅历 YueLi: Jev 简历批量分类桌面应用 (Tauri 2)"
# bin 名与包名不同, tauri CLI 靠 default-run 定位主二进制
default-run = "yueli"

[[bin]]
name = "yueli"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jev-core = { path = "../jev-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# run_batch 的事件通道类型; CancellationToken 存入应用状态
async-channel = "2"
tokio-util = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
