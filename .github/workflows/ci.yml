name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            pdfium_lib: libpdfium.dylib
          - os: ubuntu-24.04
            pdfium_lib: libpdfium.so
          - os: windows-2022
            pdfium_lib: pdfium.dll
    runs-on: ${{ matrix.os }}
    env:
      PDFIUM_DYNAMIC_LIB_PATH: ${{ github.workspace }}/vendor/pdfium/lib/${{ matrix.pdfium_lib }}
    steps:
      - uses: actions/checkout@v4

      # 与 rust-toolchain.toml 的 pin 一致, 确保 clippy/rustfmt 装到同一工具链
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/jev-app/ui/package-lock.json

      - name: Provision pdfium
        shell: bash
        run: ./scripts/fetch-pdfium.sh

      - name: Install Linux system deps (tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build frontend (all platforms)
        working-directory: crates/jev-app/ui
        run: npm ci && npm run build

      - name: Frontend unit tests
        working-directory: crates/jev-app/ui
        run: npm test

      - name: Test core (all platforms)
        run: cargo test -p jev-core

      - name: Build app (all platforms)
        run: cargo build -p jev-app

      - name: Clippy
        run: |
          cargo clippy -p jev-core -- -D warnings
          cargo clippy -p jev-app -- -D warnings

      - name: Format check
        run: cargo fmt --check
